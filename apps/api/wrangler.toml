name = "repair-lab-api"
main = "src/index.ts"
compatibility_date = "2026-09-30"

[[d1_databases]]
binding = "DB"
database_name = "repair-lab-db"

[[r2_buckets]]
binding = "R2"
bucket_name = "repair-lab-photos"

[vars]
# LOGTO_API_RESOURCE is the *audience* the API verifies on incoming tokens. It is
# a security identifier, not a network destination: it must match the API
# resource registered in Logto Console and VITE_LOGTO_API_RESOURCE in the UI.
LOGTO_ENDPOINT = "https://auth.jgrove.dev"
LOGTO_API_RESOURCE = "https://repair-lab-api.justinwgrove.workers.dev"
