name = "repair-lab-api"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# ── Production ─────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "repair-lab-db"

[[r2_buckets]]
binding = "R2"
bucket_name = "repair-lab-photos"

[vars]
ENVIRONMENT = "production"

# ── Development / staging ──────────────────────────────────────
[env.dev]
name = "repair-lab-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "repair-lab-db-dev"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "repair-lab-photos-dev"

[env.dev.vars]
ENVIRONMENT = "development"
