name = "repair-lab-api"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# ── Production ─────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "repair-lab-db"
# Value resolved from env var at deploy time (see docs/cloudflare-ci-setup.md)
database_id = "be1b0c10-f03a-47db-9b2a-e7387d72538f"

[[r2_buckets]]
binding = "R2"
bucket_name = "repair-lab-photos"

[vars]
ENVIRONMENT = "production"

# ── Development / staging ──────────────────────────────────────
[env.dev]
name = "repair-lab-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "repair-lab-db-dev"
database_id = "aa818f2a-d74d-4ad6-8890-f92eb2abfc93"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "repair-lab-photos-dev"

[env.dev.vars]
ENVIRONMENT = "development"
