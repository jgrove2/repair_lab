name = "repair-lab-ui"
main = "src/worker.ts"
compatibility_date = "2026-09-30"

# Static-asset Worker (Vite `dist/` output).
# This is what makes `npx wrangler deploy` work from apps/ui.
# Without it, Wrangler fails with "Missing entry-point to Worker script or to assets directory".
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/api"]

# Production
[[services]]
binding = "API"
service = "repair-lab-api"

# Dev
[env.dev]
name = "repair-lab-ui-dev"

[[env.dev.services]]
binding = "API"
service = "repair-lab-api-dev"
