name = "repair-lab-web"
compatibility_date = "2025-09-30"

# Static-asset Worker (Vite `dist/` output).
# This is what makes `npx wrangler deploy` work from apps/web.
# Without it, Wrangler fails with "Missing entry-point to Worker script or to assets directory".
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
