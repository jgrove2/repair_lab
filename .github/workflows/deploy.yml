name: Deploy components

on:
  workflow_call:
    inputs:
      deploy_api:
        required: true
        type: boolean
      deploy_ui:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  api:
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: repair-lab
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: apps/api
        run: >-
          pnpm exec wrangler d1 migrations apply repair-lab-db
          --remote

      - name: Deploy API Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      - name: Smoke test API
        if: ${{ vars.API_URL != '' }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 \
            "${API_URL}/health")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

  ui:
    needs: api
    if: >-
      ${{
        !cancelled() &&
        inputs.deploy_ui &&
        (
          needs.api.result == 'success' ||
          (
            needs.api.result == 'skipped' &&
            !inputs.deploy_api
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: repair-lab
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
      VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
      VITE_LOGTO_API_RESOURCE: ${{ vars.VITE_LOGTO_API_RESOURCE }}

    steps:
      - name: Check UI environment
        run: |
          : "${VITE_LOGTO_ENDPOINT:?Set VITE_LOGTO_ENDPOINT on the GitHub Environment}"
          : "${VITE_LOGTO_APP_ID:?Set VITE_LOGTO_APP_ID on the GitHub Environment}"
          : "${VITE_LOGTO_API_RESOURCE:?Set VITE_LOGTO_API_RESOURCE on the GitHub Environment}"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm turbo run build --filter=ui...

      - name: Deploy UI Worker
        working-directory: apps/ui
        run: pnpm exec wrangler deploy

      - name: Smoke test UI
        if: ${{ vars.UI_URL != '' }}
        env:
          UI_URL: ${{ vars.UI_URL }}
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 \
            "${UI_URL}/api/health")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
