name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        required: true
        type: choice
        options:
          - dev
          - production
      component:
        description: "What to deploy"
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - ui

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || inputs.target }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - "packages/shared/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".github/workflows/deploy-api.yml"
            api:
              - *shared
              - "apps/api/**"
            ui:
              - *shared
              - "apps/ui/**"
  api-dev:
    needs: changes
    if: >-
      needs.changes.result == 'success' && (
        (github.event_name == 'push' && needs.changes.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'dev' && contains(fromJSON('["all", "api"]'), inputs.component))
      )
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=api...

      - name: Apply dev D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply repair-lab-db-dev --env dev --remote

      - name: Deploy dev API Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env dev

      - name: Smoke test
        if: vars.API_URL != ''
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_URL }}/health")"
          echo "$body"
          echo "$body" | grep -q '"env":"development"'
  ui-dev:
    needs: [changes, api-dev]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.api-dev.result != 'failure' && needs.api-dev.result != 'cancelled' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.ui == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'dev' && contains(fromJSON('["all", "ui"]'), inputs.component))
      )
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
    steps:
      - name: Check required environment variables
        run: |
          : "${VITE_APP_ENV:?Set VITE_APP_ENV on the Github Environment}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=ui...

      - name: Build UI
        run: pnpm turbo run build --filter=ui...

      - name: Deploy dev UI Worker
        working-directory: apps/ui
        run: pnpm exec wrangler deploy --env dev

      - name: Smoke test
        if: vars.UI_URL != ''
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 "${{ vars.UI_URL }}/api/health")"
          echo "$body"
          echo "$body" | grep -q '"env":"development"'
  api-prod:
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["all", "api"]'), inputs.component)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=api...

      - name: Apply production D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply repair-lab-db --remote

      - name: Deploy production API Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      - name: Smoke test
        if: vars.API_URL != ''
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 "${{ vars.API_URL }}/health")"
          echo "$body"
          echo "$body" | grep -q '"env":"production"'
  ui-prod:
    needs: [changes, api-prod]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.api-prod.result != 'failure' && needs.api-prod.result != 'cancelled' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["all", "ui"]'), inputs.component)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
    steps:
      - name: Check required environment variables
        run: |
          : "${VITE_APP_ENV:?Set VITE_APP_ENV on the Github Environment}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=ui...

      - name: Build UI
        run: pnpm turbo run build --filter=ui...

      - name: Deploy production UI Worker
        working-directory: apps/ui
        run: pnpm exec wrangler deploy

      - name: Smoke test
        if: vars.UI_URL != ''
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 "${{ vars.UI_URL }}/api/health")"
          echo "$body"
          echo "$body" | grep -q '"env":"production"'
